<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102b52">
<meta name="description" content="Free Mathematics tips for Nigerian students: indices, logarithms, equations and more, explained step by step.">
<title>Maths tips - Scholar's Camp Mathematics Academy</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<style>.wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px}.posts{display:grid;gap:16px;margin-top:20px}.post-card{display:block;border:1px solid var(--line);border-radius:16px;padding:20px;background:#fff;box-shadow:var(--shadow)}.post-card h2{margin:0 0 6px;color:var(--navy);font-size:1.25rem}.post-card p{margin:0 0 8px;color:var(--muted)}.tag{display:inline-block;background:var(--sky);color:var(--navy);border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700}</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">&sum;</span><span><strong>Scholar's Camp</strong><small>Mathematics Academy</small></span></a><nav style="display:flex"><a href="index.html">&larr; Home</a></nav></header>
<main class="wrap">
  <span class="eyebrow">FREE MATHS TIPS</span>
  <h1>Learn a topic in five minutes</h1>
  <p>Short, clear explanations with worked examples. When you are ready for full video lessons and practice quizzes, <a href="index.html#courses" style="color:var(--blue);font-weight:700">see our courses</a>.</p>
  <div class="posts" id="posts"></div>
</main>
<script src="posts.js"></script>
<script src="config.js"></script>
<script src="analytics.js"></script>
<script>
document.getElementById('posts').innerHTML = POSTS.map(function (p) {
  return '<a class="post-card" href="post.html?p=' + encodeURIComponent(p.slug) + '"><span class="tag">' + p.level + '</span><h2>' + p.title.replace(/</g, '&lt;') + '</h2><p>' + p.summary.replace(/</g, '&lt;') + '</p><strong style="color:var(--blue)">Read the lesson &rarr;</strong></a>';
}).join('');
</script>
</body>
</html>
