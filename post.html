<script>
var slug = new URLSearchParams(location.search).get('p');
var post = POSTS.filter(function (p) { return p.slug === slug; })[0];
var box = document.getElementById('article');
if (!post) {
  box.innerHTML = '<h1>Lesson not found</h1><p><a href="blog.html" style="color:var(--blue)">See all Maths tips</a></p>';
} else {
  document.title = post.title + ' - Scholar\'s Camp Mathematics Academy';
  document.querySelector('meta[name=description]').setAttribute('content', post.summary.replace(/\$/g, ''));
  box.innerHTML = '<span class="eyebrow">' + post.level + '</span><h1>' + post.title + '</h1>' + post.body +
    '<div class="cta"><strong>Want more practice?</strong><p>Our courses include video lessons, timed practice quizzes and a certificate when you finish.</p><a class="button button-primary" href="index.html#courses">See the courses</a> <a class="button button-light" href="learn.html">Learner sign in</a></div>';
  renderMathInElement(box, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false });
}
</script>
</body>
