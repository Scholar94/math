<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice worksheet - Scholar's Camp Mathematics Academy</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style>
:root{--navy:#102b52;--blue:#1d65c1;--ink:#17263b;--muted:#66758b}
*{box-sizing:border-box}
body{margin:0;background:#eef2f7;color:var(--ink);font:16px/1.55 Georgia,"Times New Roman",serif}
.bar{max-width:820px;margin:16px auto;padding:0 16px;display:flex;gap:10px;flex-wrap:wrap;font-family:system-ui,sans-serif}
.btn{border:0;border-radius:9px;padding:10px 16px;font:600 1rem system-ui,sans-serif;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none}
.btn.secondary{background:#fff;color:var(--navy);border:1px solid #cfd9e5}
.sheet{max-width:820px;margin:0 auto 40px;background:#fff;padding:34px 40px;box-shadow:0 10px 30px rgba(16,43,82,.12);border-radius:6px}
.org{font:700 .8rem system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
h1{color:var(--navy);margin:.2em 0 0;font-size:1.7rem}
.sub{color:var(--muted);font:.95rem system-ui,sans-serif;margin-bottom:10px}
.fields{display:flex;gap:24px;flex-wrap:wrap;margin:14px 0 20px;font:.95rem system-ui,sans-serif}
.fields span{flex:1;min-width:200px;border-bottom:1px solid var(--ink);padding-bottom:2px}
.q{margin:0 0 16px;break-inside:avoid}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin:4px 0 0 22px}
.key{margin-top:30px;border-top:2px dashed var(--navy);padding-top:10px;break-before:page}
.key h2{color:var(--navy);font-size:1.2rem}
.key ol{columns:2;margin:0;padding-left:24px}
.key li{margin-bottom:8px;break-inside:avoid;font-size:.95rem}
.foot{margin-top:22px;color:var(--muted);font:.8rem system-ui,sans-serif;border-top:1px solid #cfd9e5;padding-top:8px}
.msg{max-width:820px;margin:30px auto;padding:14px 16px;border-radius:10px;font-family:system-ui,sans-serif;background:#fff0ef;color:#b42318}
.hidden{display:none!important}
@media(max-width:600px){.sheet{padding:20px 16px}.opts{grid-template-columns:1fr}.key ol{columns:1}}
@media print{body{background:#fff;font-size:11.5pt}.bar,.msg{display:none}.sheet{box-shadow:none;padding:0;max-width:none}}
</style>
</head>
<body>
<div class="bar"><a class="btn secondary" href="learn.html">&larr; Back to my courses</a><button class="btn" onclick="window.print()">&#128424; Print / save as PDF</button><label style="align-self:center;font:.95rem system-ui,sans-serif"><input type="checkbox" id="showKey" checked> Print answer key on a separate page</label></div>
<div id="err" class="msg hidden" role="alert"></div>
<article class="sheet hidden" id="sheet">
  <div class="org" id="org"></div>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="fields"><span>Name:</span><span>Date:</span><span>Score: &nbsp;&nbsp;&nbsp; / <b id="total"></b></span></div>
  <div id="qs"></div>
  <div class="key hidden" id="key"><h2>Answer key and explanations</h2><ol id="keyList"></ol></div>
  <div class="foot" id="foot"></div>
</article>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fail(m){document.getElementById("err").textContent=m;document.getElementById("err").classList.remove("hidden")}
var math={delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false};
(async function(){
  var q=new URLSearchParams(location.search),token="";
  try{token=(JSON.parse(sessionStorage.getItem("scLearner")||"null")||{}).t||""}catch(e){}
  if(!token){fail("Please sign in on the learner portal first, then open the worksheet from your course.");return}
  try{
    var w=await apiCall("learnerWorksheet",token,q.get("course")||"",q.get("topic")||"",Number(q.get("n"))||15);
    document.getElementById("org").textContent=w.organization||"";
    document.getElementById("title").textContent="Practice worksheet"+(w.topic?": "+w.topic:"");
    document.getElementById("sub").textContent=w.course;
    document.getElementById("total").textContent=w.questions.length;
    document.getElementById("qs").innerHTML=w.questions.map(function(x,i){
      return '<div class="q"><strong>'+(i+1)+'. '+esc(x.question)+'</strong><div class="opts">'+x.options.map(function(o,j){return '<div>'+"ABCD"[j]+'. '+esc(o)+'</div>'}).join("")+'</div></div>';
    }).join("");
    if(w.key&&w.key.length){
      var k=document.getElementById("key");k.classList.remove("hidden");
      document.getElementById("keyList").innerHTML=w.key.map(function(a){return '<li><b>'+esc(a.correct)+'</b>'+(a.explanation?' &mdash; '+esc(a.explanation):'')+'</li>'}).join("");
      document.getElementById("showKey").addEventListener("change",function(){k.classList.toggle("hidden",!this.checked)});
    }else{document.getElementById("showKey").parentNode.classList.add("hidden")}
    document.getElementById("foot").textContent="Generated "+new Date(w.generatedAt||Date.now()).toLocaleDateString()+" for "+w.licensedTo+". For personal study only.";
    document.getElementById("sheet").classList.remove("hidden");
    if(window.renderMathInElement)renderMathInElement(document.getElementById("sheet"),math);
  }catch(e){fail(e.message)}
})();
</script>
</body>
</html>
